<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혜서·우정 학원 스케쥴</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#4f46e5;
    --school:#0ea5e9; --school-bg:#e0f2fe;
    --academy:#f59e0b; --academy-bg:#fef3c7;
    --mentor:#10b981; --mentor-bg:#d1fae5;
    --etc:#8b5cf6; --etc-bg:#ede9fe;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header h1{font-size:19px;margin:0;font-weight:700;white-space:nowrap;}
  .spacer{flex:1;}
  .tabs{display:flex;gap:8px;background:var(--bg);padding:4px;border-radius:12px;}
  .tab{border:none;background:transparent;padding:9px 16px;border-radius:9px;cursor:pointer;
    font-size:15px;font-weight:600;color:var(--muted);}
  .tab.active{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  button{font-family:inherit;}
  .btn{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:9px;
    cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;}
  .btn:hover{background:var(--bg);}
  main{padding:16px 20px;max-width:1400px;margin:0 auto;}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .nav{display:flex;align-items:center;gap:8px;}
  .nav .wk{font-weight:700;font-size:15px;min-width:150px;text-align:center;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .status{font-size:12.5px;color:var(--muted);}
  .status.ok{color:var(--mentor);} .status.err{color:#dc2626;}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
  @media(max-width:1100px){.week{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.week{grid-template-columns:1fr;}}
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
    display:flex;flex-direction:column;min-height:140px;}
  .day.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset;}
  .day.sat .dayname{color:#2563eb;} .day.sun .dayname{color:#dc2626;}
  .dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .dayname{font-weight:700;font-size:15px;} .daydate{font-size:11.5px;color:var(--muted);}
  .school{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--school);
    background:var(--school-bg);border-radius:8px;padding:6px 8px;margin-bottom:8px;}
  .school b{font-weight:700;}
  .items{display:flex;flex-direction:column;gap:6px;flex:1;}
  .item{border-radius:9px;padding:7px 9px;font-size:13px;line-height:1.35;}
  .item .t{font-weight:700;font-size:12px;opacity:.85;}
  .item .ttl{font-weight:600;}
  .item .memo{font-size:11.5px;opacity:.75;margin-top:1px;}
  .type-academy{background:var(--academy-bg);color:#92400e;}
  .type-mentor{background:var(--mentor-bg);color:#065f46;}
  .type-etc{background:var(--etc-bg);color:#5b21b6;}
  .empty{color:var(--muted);font-size:12.5px;text-align:center;margin:auto 0;padding:10px 0;}
  .notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;
    padding:12px 14px;font-size:13.5px;line-height:1.55;margin-bottom:14px;}
  .notice code{background:#fff;padding:1px 6px;border-radius:5px;}
</style>
</head>
<body>
<header>
  <h1>📚 우리집 학원 스케쥴</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <button class="btn" id="refreshBtn">새로고침</button>
</header>

<main>
  <div class="bar">
    <div class="nav">
      <button class="btn" id="prevWk">◀ 지난주</button>
      <span class="wk" id="wkLabel"></span>
      <button class="btn" id="nextWk">다음주 ▶</button>
      <button class="btn" id="thisWk">이번주</button>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--school)"></i>하교</span>
      <span><i class="dot" style="background:var(--academy)"></i>학원</span>
      <span><i class="dot" style="background:var(--mentor)"></i>멘토링</span>
      <span><i class="dot" style="background:var(--etc)"></i>기타</span>
    </div>
  </div>
  <div class="status" id="status" style="margin-bottom:12px"></div>
  <div id="setupNotice"></div>
  <div class="week" id="week"></div>
</main>

<script>
/* ================== 설정 (CONFIG) ==================
   배포 전에 아래 3가지만 채우면 됩니다.
   1) API_KEY : 구글 클라우드에서 발급한 API 키
   2) CALENDARS: 공개로 전환한 캘린더 ID 목록 (자녀 학원·멘토링이 든 캘린더)
   3) DISMISS : 자녀별 요일 하교시간 (없으면 "" 로 두세요. 월~금만)
   ================================================== */
const CONFIG = {
  API_KEY: "여기에_API_키_붙여넣기",
  CALENDARS: [
    "e4f5082b87e3395ef9a016bc87204cbce06df62d70326aafa2940654b98cbb56@group.calendar.google.com" // 학원일정
  ],
  KIDS: [
    { name:"혜서", keyword:"혜서" },
    { name:"우정", keyword:"우정" }
  ],
  // 하교시간: [월,화,수,목,금]  (예: ["15:30","15:30","14:40","15:30","13:20"])
  DISMISS: {
    "혜서": ["","","","",""],
    "우정": ["","","","",""]
  }
};
/* ============== 설정 끝 ============== */

const DAYS = ["월","화","수","목","금","토","일"];
let activeKid = 0;
let weekOffset = 0;        // 0=이번주, -1=지난주, +1=다음주
let cache = {};            // weekOffset별 분류된 일정 캐시

const tabsEl=document.getElementById("tabs"), weekEl=document.getElementById("week");
const statusEl=document.getElementById("status"), wkLabel=document.getElementById("wkLabel");
function setStatus(m,c){ statusEl.textContent=m||""; statusEl.className="status"+(c?" "+c:""); }
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function weekDates(offset){
  const now=new Date();
  const di=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-di+offset*7);
  return DAYS.map((_,i)=>{const d=new Date(mon); d.setDate(mon.getDate()+i); return d;});
}
function detectType(t){
  if(/멘토링|멘토/.test(t)) return "mentor";
  if(/학원|수업|과외|레슨/.test(t)) return "academy";
  return "etc";
}

function renderTabs(){
  tabsEl.innerHTML="";
  CONFIG.KIDS.forEach((k,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===activeKid?" active":"");
    b.textContent=k.name; b.onclick=()=>{activeKid=i; renderTabs(); renderWeek();};
    tabsEl.appendChild(b);
  });
}

function renderWeek(){
  const dates=weekDates(weekOffset);
  wkLabel.textContent=`${dates[0].getMonth()+1}/${dates[0].getDate()} ~ ${dates[6].getMonth()+1}/${dates[6].getDate()}`;
  const kid=CONFIG.KIDS[activeKid];
  const byDay=(cache[weekOffset]&&cache[weekOffset][kid.name])||[[],[],[],[],[],[],[]];
  const todayStr=new Date().toDateString();
  weekEl.innerHTML="";
  DAYS.forEach((d,di)=>{
    const dt=dates[di];
    const day=document.createElement("div");
    day.className="day"+(di===5?" sat":di===6?" sun":"")+(dt.toDateString()===todayStr?" today":"");
    day.innerHTML=`<div class="dayhead"><span class="dayname">${d}요일</span>
      <span class="daydate">${dt.getMonth()+1}/${dt.getDate()}</span></div>`;
    const dm=(di<5)?(CONFIG.DISMISS[kid.name]&&CONFIG.DISMISS[kid.name][di]):"";
    if(dm){
      const s=document.createElement("div"); s.className="school";
      s.innerHTML=`🏫 하교 <b>${dm}</b>`; day.appendChild(s);
    }
    const items=document.createElement("div"); items.className="items";
    const list=[...byDay[di]].sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    if(list.length===0){
      const e=document.createElement("div"); e.className="empty"; e.textContent="일정 없음"; items.appendChild(e);
    }
    list.forEach(it=>{
      const el=document.createElement("div"); el.className="item type-"+it.type;
      el.innerHTML=`${it.time?`<div class="t">${it.time}${it.end?"~"+it.end:""}</div>`:""}`+
        `<div class="ttl">${escapeHtml(it.title)}</div>`+
        `${it.memo?`<div class="memo">${escapeHtml(it.memo)}</div>`:""}`;
      items.appendChild(el);
    });
    day.appendChild(items);
    weekEl.appendChild(day);
  });
}

async function loadWeek(offset){
  if(CONFIG.API_KEY.includes("여기에")){
    showSetupNotice(); return;
  }
  document.getElementById("setupNotice").innerHTML="";
  setStatus("일정 불러오는 중…");
  const dates=weekDates(offset);
  const timeMin=new Date(dates[0]); timeMin.setHours(0,0,0,0);
  const timeMax=new Date(dates[6]); timeMax.setHours(23,59,59,999);
  const result={}; CONFIG.KIDS.forEach(k=>result[k.name]=[[],[],[],[],[],[],[]]);
  try{
    for(const calId of CONFIG.CALENDARS){
      const url="https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(calId)+"/events?"+
        new URLSearchParams({key:CONFIG.API_KEY,timeMin:timeMin.toISOString(),timeMax:timeMax.toISOString(),
          singleEvents:"true",orderBy:"startTime",maxResults:"250"});
      const res=await fetch(url);
      if(!res.ok){
        const txt=await res.text();
        setStatus(`불러오기 실패 (${res.status}). 캘린더 공개 설정과 API 키를 확인하세요.`,"err");
        console.error(txt); return;
      }
      const json=await res.json();
      (json.items||[]).forEach(ev=>{
        const title=ev.summary||"(제목 없음)";
        const ki=CONFIG.KIDS.findIndex(k=>k.keyword && title.includes(k.keyword));
        if(ki<0) return;
        const startISO=ev.start.dateTime||ev.start.date;
        const start=new Date(startISO);
        const di=(start.getDay()+6)%7;
        const allDay=!ev.start.dateTime;
        const fmt=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        const clean=title.replace(CONFIG.KIDS[ki].keyword,"").replace(/^[\s\-:·]+/,"").trim()||title;
        result[CONFIG.KIDS[ki].name][di].push({
          type:detectType(title), title:clean, time:allDay?"":fmt(start),
          end:(!allDay&&ev.end&&ev.end.dateTime)?fmt(new Date(ev.end.dateTime)):"", memo:ev.location||""
        });
      });
    }
    cache[offset]=result;
    const now=new Date();
    setStatus(`✅ ${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")} 기준 최신 일정`,"ok");
    renderWeek();
  }catch(e){ setStatus("오류: "+e.message,"err"); }
}

function showSetupNotice(){
  document.getElementById("setupNotice").innerHTML=
    `<div class="notice">⚙️ <b>아직 설정이 안 됐습니다.</b> 파일 상단 <code>CONFIG</code>의 <code>API_KEY</code>를 발급받은 키로 바꾸고,
     캘린더를 <b>공개</b>로 전환한 뒤 다시 여세요. (자세한 방법은 배포 안내 참고)</div>`;
}

document.getElementById("refreshBtn").onclick=()=>{ delete cache[weekOffset]; loadWeek(weekOffset); };
document.getElementById("prevWk").onclick=()=>{ weekOffset--; cache[weekOffset]?renderWeek():loadWeek(weekOffset); };
document.getElementById("nextWk").onclick=()=>{ weekOffset++; cache[weekOffset]?renderWeek():loadWeek(weekOffset); };
document.getElementById("thisWk").onclick=()=>{ weekOffset=0; cache[0]?renderWeek():loadWeek(0); };

renderTabs(); renderWeek(); loadWeek(0);
</script>
</body>
</html>
