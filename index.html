<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혜서·우정 학원 스케쥴</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#f5f6fc; --card:#ffffff; --ink:#1b2233; --muted:#8089a3;
    --line:#eceef6;
    --school:#0ea5e9; --school-bg:#e2f4fe;
    --academy:#f59e0b; --academy-bg:#fff6e3; --academy-ink:#b45309;
    --mentor:#10b981; --mentor-bg:#e3fbf1; --mentor-ink:#047857;
    --etc:#8b5cf6;   --etc-bg:#f1ecfe;     --etc-ink:#6d28d9;
    /* 자녀별 포인트 색 (기본=혜서) */
    --accent:#ff5e7e; --accent2:#ff9f45;
  }
  body[data-kid="0"]{ --accent:#ff5e7e; --accent2:#ff9f45; } /* 혜서: 코랄→오렌지 */
  body[data-kid="1"]{ --accent:#7c5cff; --accent2:#3ec9ff; } /* 우정: 퍼플→시안 */

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:
      radial-gradient(1200px 500px at 100% -10%, color-mix(in srgb,var(--accent2) 18%, transparent), transparent),
      radial-gradient(1000px 460px at -10% -10%, color-mix(in srgb,var(--accent) 16%, transparent), transparent),
      var(--bg);
    color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh;
    transition:--accent .4s;
  }

  /* ===== 헤더 ===== */
  header{
    background:linear-gradient(115deg,var(--accent),var(--accent2));
    padding:18px 22px; position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    box-shadow:0 8px 24px -12px color-mix(in srgb,var(--accent) 60%, transparent);
  }
  header h1{font-size:21px;margin:0;font-weight:800;color:#fff;white-space:nowrap;letter-spacing:-.4px;
    text-shadow:0 1px 8px rgba(0,0,0,.12);display:flex;align-items:center;gap:8px;}
  .spacer{flex:1;}
  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.22);padding:5px;border-radius:14px;backdrop-filter:blur(4px);}
  .tab{border:none;background:transparent;padding:9px 20px;border-radius:10px;cursor:pointer;
    font-size:15px;font-weight:700;color:rgba(255,255,255,.9);transition:.18s;}
  .tab:hover{background:rgba(255,255,255,.18);}
  .tab.active{background:#fff;color:var(--accent);box-shadow:0 4px 14px -4px rgba(0,0,0,.25);}
  button{font-family:inherit;}
  .btn{border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;
    padding:9px 15px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap;transition:.18s;}
  .btn:hover{background:rgba(255,255,255,.28);}

  main{padding:20px 22px 40px;max-width:1440px;margin:0 auto;}

  /* ===== 상단 바: 주간 네비 + 범례 ===== */
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
  .nav{display:flex;align-items:center;gap:8px;background:var(--card);padding:6px;border-radius:14px;
    box-shadow:0 6px 20px -14px rgba(27,34,51,.4);}
  .nav .navbtn{border:none;background:transparent;color:var(--ink);font-weight:700;font-size:14px;
    padding:8px 12px;border-radius:9px;cursor:pointer;transition:.15s;}
  .nav .navbtn:hover{background:var(--bg);color:var(--accent);}
  .nav .wk{font-weight:800;font-size:15px;min-width:130px;text-align:center;color:var(--ink);letter-spacing:-.3px;}
  .nav .navbtn.this{color:var(--accent);}
  .legend{display:flex;gap:13px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:4px;display:inline-block;}
  .status{font-size:12.5px;color:var(--muted);font-weight:600;margin:4px 0 16px;}
  .status.ok{color:var(--mentor-ink);} .status.err{color:#dc2626;}

  /* ===== 주간 그리드 ===== */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:13px;}
  @media(max-width:1240px){.week{grid-template-columns:repeat(4,1fr);}}
  @media(max-width:820px){.week{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:430px){.week{grid-template-columns:1fr;}}

  .day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;
    display:flex;flex-direction:column;min-height:148px;
    box-shadow:0 10px 28px -20px rgba(27,34,51,.5);transition:transform .16s, box-shadow .16s;}
  .day:hover{transform:translateY(-3px);box-shadow:0 18px 34px -20px rgba(27,34,51,.45);}
  .day.today{border-color:transparent;
    box-shadow:0 0 0 2.5px var(--accent), 0 16px 34px -18px color-mix(in srgb,var(--accent) 55%, transparent);}
  .dayhead{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
  .dayname{font-weight:800;font-size:16px;letter-spacing:-.3px;}
  .day.sat .dayname{color:#2f6bff;} .day.sun .dayname{color:#ff4d6d;}
  .daydate{font-size:12px;color:var(--muted);font-weight:700;}
  .todaybadge{margin-left:auto;font-size:11px;font-weight:800;color:#fff;
    background:linear-gradient(120deg,var(--accent),var(--accent2));padding:3px 9px;border-radius:999px;
    box-shadow:0 4px 10px -4px var(--accent);}

  .school{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#0369a1;font-weight:700;
    background:linear-gradient(120deg,#e2f4fe,#eaf7ff);border:1px solid #d4ecfb;
    border-radius:11px;padding:7px 10px;margin-bottom:9px;}
  .school b{font-weight:800;font-size:13.5px;}

  .items{display:flex;flex-direction:column;gap:8px;flex:1;}
  .item{position:relative;border-radius:12px;padding:9px 11px 9px 13px;line-height:1.3;
    border-left:4px solid var(--c);background:var(--cbg);overflow:hidden;}
  .item .t{font-weight:800;font-size:15px;color:var(--cink);letter-spacing:-.4px;font-variant-numeric:tabular-nums;}
  .item .ttl{font-weight:700;font-size:13.5px;color:var(--ink);margin-top:1px;}
  .item .memo{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;}
  .type-academy{--c:var(--academy);--cbg:var(--academy-bg);--cink:var(--academy-ink);}
  .type-mentor {--c:var(--mentor); --cbg:var(--mentor-bg); --cink:var(--mentor-ink);}
  .type-etc    {--c:var(--etc);    --cbg:var(--etc-bg);    --cink:var(--etc-ink);}

  .empty{color:#b6bccd;font-size:12.5px;font-weight:700;text-align:center;margin:auto 0;padding:14px 0;
    border:1.5px dashed #e6e9f2;border-radius:12px;}

  .notice{background:linear-gradient(120deg,#fff7ed,#fff3e0);border:1px solid #fed7aa;color:#9a3412;
    border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.55;margin-bottom:16px;font-weight:600;}
  .notice code{background:#fff;padding:1px 6px;border-radius:6px;}

  @media(max-width:520px){
    header{padding:14px 16px;} header h1{font-size:18px;}
    main{padding:16px 14px 36px;}
    .tab{padding:8px 16px;}
    .day{min-height:0;}
  }
</style>
</head>
<body data-kid="0">
<header>
  <h1>🗓️ 우리집 스케쥴</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <button class="btn" id="refreshBtn">↻ 새로고침</button>
</header>

<main>
  <div class="bar">
    <div class="nav">
      <button class="navbtn" id="prevWk">◀</button>
      <span class="wk" id="wkLabel"></span>
      <button class="navbtn" id="nextWk">▶</button>
      <button class="navbtn this" id="thisWk">오늘</button>
    </div>
    <div class="spacer"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--school)"></i>하교</span>
      <span><i class="dot" style="background:var(--academy)"></i>학원</span>
      <span><i class="dot" style="background:var(--mentor)"></i>멘토링</span>
      <span><i class="dot" style="background:var(--etc)"></i>기타</span>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div id="setupNotice"></div>
  <div class="week" id="week"></div>
</main>

<script>
/* ================== 설정 (CONFIG) ==================
   배포 전에 아래 3가지만 채우면 됩니다.
   1) API_KEY : 구글 클라우드에서 발급한 API 키
   2) CALENDARS: 공개로 전환한 캘린더 ID 목록 (자녀 학원·멘토링이 든 캘린더)
   3) DISMISS : 자녀별 요일 하교시간 (없으면 "" 로 두세요. 월~금만)
   ================================================== */
const CONFIG = {
  API_KEY: "AIzaSyBpUg-OTRdtmur7wN3eMFvit3Yxqpj2_io",
  CALENDARS: [
    "e4f5082b87e3395ef9a016bc87204cbce06df62d70326aafa2940654b98cbb56@group.calendar.google.com" // 학원일정
  ],
  KIDS: [
    { name:"혜서", keyword:"혜서" },
    { name:"우정", keyword:"우정" }
  ],
  // 하교시간: [월,화,수,목,금]  (예: ["15:30","15:30","14:40","15:30","13:20"])
  DISMISS: {
    "혜서": ["14:10","14:10","13:30","14:10","14:10"],
    "우정": ["13:25","13:25","13:25","14:10","13:25"]
  }
};
/* ============== 설정 끝 ============== */

const DAYS = ["월","화","수","목","금","토","일"];
let activeKid = 0;
let weekOffset = 0;        // 0=이번주, -1=지난주, +1=다음주
let cache = {};            // weekOffset별 분류된 일정 캐시

const tabsEl=document.getElementById("tabs"), weekEl=document.getElementById("week");
const statusEl=document.getElementById("status"), wkLabel=document.getElementById("wkLabel");
function setStatus(m,c){ statusEl.textContent=m||""; statusEl.className="status"+(c?" "+c:""); }
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function weekDates(offset){
  const now=new Date();
  const di=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-di+offset*7);
  return DAYS.map((_,i)=>{const d=new Date(mon); d.setDate(mon.getDate()+i); return d;});
}
function detectType(t){
  if(/멘토링|멘토/.test(t)) return "mentor";
  if(/학원|수업|과외|레슨/.test(t)) return "academy";
  return "etc";
}

function renderTabs(){
  document.body.dataset.kid=activeKid;
  tabsEl.innerHTML="";
  CONFIG.KIDS.forEach((k,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===activeKid?" active":"");
    b.textContent=k.name; b.onclick=()=>{activeKid=i; renderTabs(); renderWeek();};
    tabsEl.appendChild(b);
  });
}

function renderWeek(){
  document.body.dataset.kid=activeKid;
  const dates=weekDates(weekOffset);
  wkLabel.textContent=`${dates[0].getMonth()+1}/${dates[0].getDate()} ~ ${dates[6].getMonth()+1}/${dates[6].getDate()}`;
  const kid=CONFIG.KIDS[activeKid];
  const byDay=(cache[weekOffset]&&cache[weekOffset][kid.name])||[[],[],[],[],[],[],[]];
  const todayStr=new Date().toDateString();
  weekEl.innerHTML="";
  DAYS.forEach((d,di)=>{
    const dt=dates[di];
    const isToday=dt.toDateString()===todayStr;
    const day=document.createElement("div");
    day.className="day"+(di===5?" sat":di===6?" sun":"")+(isToday?" today":"");
    day.innerHTML=`<div class="dayhead"><span class="dayname">${d}</span>
      <span class="daydate">${dt.getMonth()+1}/${dt.getDate()}</span>
      ${isToday?`<span class="todaybadge">오늘</span>`:""}</div>`;
    const dm=(di<5)?(CONFIG.DISMISS[kid.name]&&CONFIG.DISMISS[kid.name][di]):"";
    if(dm){
      const s=document.createElement("div"); s.className="school";
      s.innerHTML=`🏫 하교 <b>${dm}</b>`; day.appendChild(s);
    }
    const items=document.createElement("div"); items.className="items";
    const list=[...byDay[di]].sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    if(list.length===0){
      const e=document.createElement("div"); e.className="empty"; e.textContent="일정 없음"; items.appendChild(e);
    }
    list.forEach(it=>{
      const el=document.createElement("div"); el.className="item type-"+it.type;
      el.innerHTML=`${it.time?`<div class="t">${it.time}${it.end?" ~ "+it.end:""}</div>`:""}`+
        `<div class="ttl">${escapeHtml(it.title)}</div>`+
        `${it.memo?`<div class="memo">📍 ${escapeHtml(it.memo)}</div>`:""}`;
      items.appendChild(el);
    });
    day.appendChild(items);
    weekEl.appendChild(day);
  });
}

async function loadWeek(offset){
  if(CONFIG.API_KEY.includes("여기에")){
    showSetupNotice(); return;
  }
  document.getElementById("setupNotice").innerHTML="";
  setStatus("일정 불러오는 중…");
  const dates=weekDates(offset);
  const timeMin=new Date(dates[0]); timeMin.setHours(0,0,0,0);
  const timeMax=new Date(dates[6]); timeMax.setHours(23,59,59,999);
  const result={}; CONFIG.KIDS.forEach(k=>result[k.name]=[[],[],[],[],[],[],[]]);
  try{
    for(const calId of CONFIG.CALENDARS){
      const url="https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(calId)+"/events?"+
        new URLSearchParams({key:CONFIG.API_KEY,timeMin:timeMin.toISOString(),timeMax:timeMax.toISOString(),
          singleEvents:"true",orderBy:"startTime",maxResults:"250"});
      const res=await fetch(url);
      if(!res.ok){
        const txt=await res.text();
        setStatus(`불러오기 실패 (${res.status}). 캘린더 공개 설정과 API 키를 확인하세요.`,"err");
        console.error(txt); return;
      }
      const json=await res.json();
      (json.items||[]).forEach(ev=>{
        const title=ev.summary||"(제목 없음)";
        const ki=CONFIG.KIDS.findIndex(k=>k.keyword && title.includes(k.keyword));
        if(ki<0) return;
        const startISO=ev.start.dateTime||ev.start.date;
        const start=new Date(startISO);
        const di=(start.getDay()+6)%7;
        const allDay=!ev.start.dateTime;
        const fmt=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        const clean=title.replace(CONFIG.KIDS[ki].keyword,"").replace(/^[\s\-:·]+/,"").trim()||title;
        result[CONFIG.KIDS[ki].name][di].push({
          type:detectType(title), title:clean, time:allDay?"":fmt(start),
          end:(!allDay&&ev.end&&ev.end.dateTime)?fmt(new Date(ev.end.dateTime)):"", memo:ev.location||""
        });
      });
    }
    cache[offset]=result;
    const now=new Date();
    setStatus(`✅ ${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")} 기준 최신 일정`,"ok");
    renderWeek();
  }catch(e){ setStatus("오류: "+e.message,"err"); }
}

function showSetupNotice(){
  document.getElementById("setupNotice").innerHTML=
    `<div class="notice">⚙️ <b>아직 설정이 안 됐습니다.</b> 파일 상단 <code>CONFIG</code>의 <code>API_KEY</code>를 발급받은 키로 바꾸고,
     캘린더를 <b>공개</b>로 전환한 뒤 다시 여세요. (자세한 방법은 배포 안내 참고)</div>`;
}

document.getElementById("refreshBtn").onclick=()=>{ delete cache[weekOffset]; loadWeek(weekOffset); };
document.getElementById("prevWk").onclick=()=>{ weekOffset--; cache[weekOffset]?renderWeek():loadWeek(weekOffset); };
document.getElementById("nextWk").onclick=()=>{ weekOffset++; cache[weekOffset]?renderWeek():loadWeek(weekOffset); };
document.getElementById("thisWk").onclick=()=>{ weekOffset=0; cache[0]?renderWeek():loadWeek(0); };

renderTabs(); renderWeek(); loadWeek(0);
</script>
</body>
</html>
